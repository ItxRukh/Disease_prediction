<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{% block title %}MediPredict{% endblock %}</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
      body {
        opacity: 0;
        transition: opacity 0.6s ease-in-out;
      }
      body.fade-in {
        opacity: 1;
      }
    </style>
  </head>
  <body
    class="bg-[#ADB2D4] bg-[url('/static/6.jpg')] bg-no-repeat bg-cover bg-center min-h-screen"
  >
    <!-- Navbar -->
    <nav
      class="backdrop-blur-[6px] bg-[#014d6b]/10 border border-white/40 shadow-sm top-0 left-0 w-full"
    >
      <div class="max-w-6xl px-4">
        <div class="flex justify-between items-center sm:h-[4.5rem] h-[4rem]">
          <div>
            <img
              src="/static/logo.png"
              class="sm:w-[10rem] sm:h-[4rem] w-[7rem] h-[4rem]"
              alt="Logo"
            />
          </div>
          <div class="md:space-x-6 space-x-3 flex">
            <!-- Home -->
            <a
              href="/"
              class="relative sm:text-[1.5rem] transition hover:text-[#7A85C1] after:absolute after:left-0 after:-bottom-1 after:w-0 after:h-[2px] after:bg-[#7A85C1] after:transition-all after:duration-300 hover:after:w-full {% if request.path == '/' %} text-[#7A85C1] font-semibold after:w-full {% else %} text-[#154D71] {% endif %}"
            >
              Home
            </a>

            <!-- About -->
            <a
              href="/about"
              class="relative sm:text-[1.5rem] transition hover:text-[#7A85C1] after:absolute after:left-0 after:-bottom-1 after:w-0 after:h-[2px] after:bg-[#7A85C1] after:transition-all after:duration-300 hover:after:w-full {% if request.path == '/about' %} text-[#7A85C1] font-semibold after:w-full {% else %} text-[#154D71] {% endif %}"
            >
              About Us
            </a>

            <!-- Contact -->
            <a
              href="/contact"
              class="relative sm:text-[1.5rem] transition hover:text-[#7A85C1] after:absolute after:left-0 after:-bottom-1 after:w-0 after:h-[2px] after:bg-[#7A85C1] after:transition-all after:duration-300 hover:after:w-full {% if request.path == '/contact' %} text-[#7A85C1] font-semibold after:w-full {% else %} text-[#154D71] {% endif %}"
            >
              Contact Us
            </a>
          </div>
        </div>
      </div>
    </nav>

    <!-- Page Content -->
    <div class="pt-10">{% block content %}{% endblock %}</div>

    <!-- Script for transition -->
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        document.body.classList.add("fade-in");
      });
    </script>
  </body>
</html>
