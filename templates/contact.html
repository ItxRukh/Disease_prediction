{% extends "base.html" %}
{% block content %}
<div class="flex items-center justify-center min-h-screen px-4">
  <div class="flex flex-col md:flex-row w-full max-w-5xl rounded-[0.4rem] shadow-xl overflow-hidden">
    
    <!-- Left Section (Glassmorphism) -->
    <div class="border border-white/40 bg-[#243642]/10 backdrop-blur-lg flex flex-col justify-center items-center text-center p-8 md:p-10 md:w-1/2 border-r border-white/20">
      <img src="https://img.icons8.com/ios-filled/100/ffffff/medical-doctor.png" 
           alt="Doctor Icon" class="w-24 h-24 mb-4">
      <h2 class="text-2xl font-semibold text-white">We at MediPredict</h2>
      <p class="mt-3 text-white text-base">
        are always here to listen to your concerns <br>
        and help you predict better health outcomes.
      </p>
    </div>

    <!-- Right Section (Normal White) -->
    <div class="flex flex-col justify-center p-8 md:p-12 w-full md:w-1/2 bg-white">
      <h2 class="text-2xl font-bold mb-6 text-gray-800">Contact Us</h2>
      <form method="POST" action="/contact" class="space-y-4">
        <input type="text" name="name" placeholder="Your Full Name" required 
               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        
        <input type="email" name="email" placeholder="Your Email" required 
               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        
        <input type="text" name="subject" placeholder="Subject" required 
               class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none">
        
        <textarea name="message" placeholder="Your Message" required rows="4"
                  class="w-full p-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 outline-none"></textarea>
        
        <button type="submit" 
                class="w-full py-3  text-white font-semibold rounded-lg bg-red-600  hover:bg-red-700 transform hover:scale-105 transition duration-200">
          Send Message
        </button>
      </form>
      <p class="mt-4 text-sm text-gray-500">We will get back to you within 24 hours.</p>
    </div>
  </div>
</div>
{% endblock %}
